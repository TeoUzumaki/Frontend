<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="FORM"><meta name="description" content="Exercise library, muscle explorer, and workout builder"><link rel="manifest" href="/Gym/manifest.webmanifest"><link rel="apple-touch-icon" href="/Gym/icons/icon-180.png"><title>FORM / Exercise Atlas</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#f3f5f7;background:#0b0e12}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1450px;margin:auto;display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.side{border-right:1px solid #242a30;padding:32px 18px;background:#0d1116}.logo{font-size:25px;font-weight:950;letter-spacing:-1.5px;padding:0 13px 38px}.logo span{color:#b8fa69}.nav{width:100%;display:flex;align-items:center;gap:13px;background:transparent;color:#99a4ae;border:0;padding:15px 16px;border-radius:12px;text-align:left;margin:3px 0}.nav.active{background:#b8fa69;color:#111a0c;font-weight:800}.nav:hover:not(.active){background:#1b2229}.sidefoot{margin-top:65px;color:#65717d;font-size:12px;padding:14px;line-height:1.8}.main{padding:36px 42px 80px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:2.5px;color:#b8fa69;text-transform:uppercase}.title{font-size:clamp(34px,4.2vw,58px);line-height:1.05;letter-spacing:-2.8px;margin:10px 0}.muted{color:#929da7}.pill{background:#1a2229;color:#dbe4e9;padding:10px 15px;border-radius:30px;font-size:12px;font-weight:700}.hero{background:radial-gradient(circle at 83% 30%,#35482b 0,transparent 40%),linear-gradient(125deg,#1c2525,#151b21);border:1px solid #344136;border-radius:22px;margin:30px 0;padding:31px;display:flex;justify-content:space-between;gap:20px;overflow:hidden}.hero h2{font-size:28px;letter-spacing:-1px;margin:8px 0}.hero p{max-width:500px;line-height:1.6}.hero .orb{font-size:95px;opacity:.8;align-self:center}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:25px 0}.filter{border:1px solid #29323b;background:#171d24;color:#aab5bf;padding:10px 17px;border-radius:10px;font-size:13px}.filter.selected{background:#b8fa69;color:#131a0e;border-color:#b8fa69;font-weight:800}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.search{background:#161d24;border:1px solid #303943;color:#fff;border-radius:11px;padding:13px 16px;min-width:260px;outline:none}.count{color:#89949e;font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px}.card{background:#151b22;border:1px solid #29313a;border-radius:17px;overflow:hidden;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-3px);border-color:#b8fa69}.art{height:185px;background:radial-gradient(circle at center,#29362c,#1b232a 75%);position:relative;display:grid;place-items:center}.art svg{height:175px;width:100%}.tag{position:absolute;left:12px;top:12px;background:#0e1419bd;color:#e6f0f0;padding:6px 9px;border-radius:7px;font-size:10px;font-weight:800;text-transform:uppercase}.cardbody{padding:19px}.card h3{font-size:18px;letter-spacing:-.4px;margin:4px 0 9px}.small{font-size:12px;color:#8f9ca6}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.chip{background:#27322b;color:#b8fa69;padding:6px 9px;border-radius:6px;font-size:11px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:9px;padding:11px 14px;font-size:12px;font-weight:850}.primary{background:#b8fa69;color:#111b0b}.secondary{background:#2a323b;color:#eaf0f4}.actions .primary{flex:1}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-top:27px}.sectionhead h2{font-size:23px;letter-spacing:-.7px}.empty{padding:45px;text-align:center;color:#89949e}.detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:27px;margin-top:25px}.bigart{background:radial-gradient(circle,#33402f,#171e25 72%);border:1px solid #334036;border-radius:20px;min-height:400px;display:grid;place-items:center;position:relative}.bigart svg{width:95%;height:340px}.panel{background:#161c23;border:1px solid #2c353e;border-radius:17px;padding:24px;margin-bottom:15px}.panel h3{margin-top:0}.steps{padding-left:22px;color:#c2ccd2;line-height:1.75}.steps li{padding:5px 0}.warn{color:#f7ca89}.muscles{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:25px}.muscle{background:#171e24;border:1px solid #2b343b;border-radius:15px;padding:22px;text-align:left;color:#f3f6f6}.muscle strong{display:block;font-size:20px;margin-bottom:6px}.muscle:hover{border-color:#b8fa69}.routineItem{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid #303840}.routineItem:last-child{border:0}.back{background:transparent;border:0;color:#b8fa69;font-weight:750;padding:10px 0}.mini{color:#b8fa69;font-size:12px;font-weight:700}.footer{margin-top:45px;color:#73808a;font-size:12px;line-height:1.7}.demo-note{position:absolute;bottom:15px;left:0;right:0;text-align:center;font-size:11px;color:#a7b8aa}.hidden{display:none}.stat{color:#b8fa69;font-size:34px;font-weight:900}.muscle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.muscle-grid button{background:#202a30;color:#d9e4e6;border:1px solid #334047;border-radius:12px;padding:18px;text-align:left}.muscle-grid button:hover{border-color:#b8fa69}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.side{padding:25px 9px}.shell{grid-template-columns:190px 1fr}.main{padding:30px 24px}}@media(max-width:680px){.shell{display:block}.side{display:flex;align-items:center;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid #273039;padding:12px}.logo{padding:0 12px;font-size:19px}.nav{width:auto;white-space:nowrap;font-size:12px;padding:10px}.sidefoot{display:none}.main{padding:25px 16px}.hero{padding:22px}.hero .orb{display:none}.cards{grid-template-columns:1fr 1fr;gap:10px}.art{height:140px}.art svg{height:130px}.cardbody{padding:12px}.card h3{font-size:15px}.detail,.muscles{grid-template-columns:1fr}.bigart{min-height:280px}.bigart svg{height:260px}.muscle-grid{grid-template-columns:repeat(2,1fr)}.search{width:100%}}@media(max-width:410px){.cards{grid-template-columns:1fr}}
.viewer3d{position:relative;min-height:410px;background:radial-gradient(circle at 50% 38%,#314238,#101820 75%);border:1px solid #36463d;border-radius:20px;overflow:hidden;touch-action:none}.viewer3d canvas{display:block;width:100%;height:410px;cursor:grab}.viewer3d canvas:active{cursor:grabbing}.viewerControls{position:absolute;left:14px;right:14px;bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:center;pointer-events:none}.viewerControls>*{pointer-events:auto}.viewerHint{font-size:11px;background:#101a1ddd;padding:9px 11px;border-radius:9px;color:#d5e6da}.viewerControls button{background:#b8fa69;border:0;border-radius:9px;padding:9px 13px;font-weight:800;color:#12200e}.viewerError{padding:30px;color:#b6c6c5;text-align:center}.viewer3d .demo-note{bottom:57px}@media(max-width:680px){.viewer3d canvas{height:330px}.viewer3d{min-height:330px}} 
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.side{padding-left:max(12px,env(safe-area-inset-left))}.main{padding-right:max(16px,env(safe-area-inset-right))}</style></head><body><div class="shell"><aside class="side"><div class="logo">FORM<span> /</span></div><button class="nav active" data-tab="library">◫ &nbsp; Exercise library</button><button class="nav" data-tab="muscles">◎ &nbsp; Muscle explorer</button><button class="nav" data-tab="routine">▤ &nbsp; My workout <span id="sideCount"></span></button><div class="sidefoot">MOVE WITH INTENTION.<br>TRAIN WITH CONFIDENCE.<br><br>FORM / ATLAS 01</div></aside><main class="main" id="app"></main></div>
<script>
const exercises=[
{name:"Dumbbell Bench Press",equipment:"Dumbbell",primary:"Chest",secondary:["Triceps","Shoulders"],level:"Beginner",type:"press",sets:"3 × 8–12",steps:["Lie on a flat bench with feet planted firmly.","Hold dumbbells beside your chest, wrists stacked above elbows.","Press upward and slightly inward without crashing the weights together.","Lower slowly until elbows are just below bench height, within a comfortable shoulder range."],cue:"Keep shoulder blades gently pulled back and down.",mistake:"Flaring elbows straight out or bouncing at the bottom."},
{name:"Incline Dumbbell Press",equipment:"Dumbbell",primary:"Chest",secondary:["Shoulders","Triceps"],level:"Beginner",type:"press",sets:"3 × 8–12",steps:["Set bench to approximately 15–30° incline.","Plant feet and keep upper back supported.","Lower dumbbells to upper chest with forearms nearly vertical.","Press up under control without shrugging."],cue:"Keep the incline modest to emphasise upper chest.",mistake:"Setting the bench too upright."},
{name:"Dumbbell Biceps Curl",equipment:"Dumbbell",primary:"Biceps",secondary:["Forearms"],level:"Beginner",type:"curl",sets:"3 × 10–15",steps:["Stand tall with a dumbbell in each hand, palms forward.","Keep upper arms near your sides.","Bend elbows to lift weights without swinging your torso.","Lower under control until elbows are almost straight."],cue:"Move your forearms, not your shoulders.",mistake:"Swinging your back to lift heavier weights."},
{name:"Hammer Curl",equipment:"Dumbbell",primary:"Biceps",secondary:["Forearms"],level:"Beginner",type:"curl",sets:"3 × 10–15",steps:["Stand with palms facing your thighs.","Keep wrists neutral and elbows by your sides.","Curl weights towards shoulders.","Lower slowly without swinging."],cue:"Keep thumbs pointing up.",mistake:"Letting elbows drift forward."},
{name:"Dumbbell Lateral Raise",equipment:"Dumbbell",primary:"Shoulders",secondary:["Traps"],level:"Beginner",type:"raise",sets:"3 × 12–20",steps:["Stand tall with a light dumbbell in each hand.","Maintain a small bend in elbows.","Raise arms out to the sides to around shoulder height.","Lower with control, keeping shoulders relaxed."],cue:"Lead with upper arms and use lighter weights.",mistake:"Shrugging or swinging the dumbbells."},
{name:"Seated Dumbbell Shoulder Press",equipment:"Dumbbell",primary:"Shoulders",secondary:["Triceps"],level:"Intermediate",type:"overhead",sets:"3 × 8–12",steps:["Sit with back supported and feet planted.","Start with dumbbells around ear height.","Press overhead in a comfortable arc.","Lower slowly without excessively arching your back."],cue:"Keep ribs stacked over pelvis.",mistake:"Overarching the lower back."},
{name:"One-arm Dumbbell Row",equipment:"Dumbbell",primary:"Back",secondary:["Biceps","Rear delts"],level:"Beginner",type:"row",sets:"3 × 8–12 / side",steps:["Support one hand on a stable bench, hinge at hips.","Keep spine neutral and shoulders square.","Pull dumbbell toward your hip, elbow close to torso.","Lower until arm extends without twisting your body."],cue:"Drive your elbow toward your back pocket.",mistake:"Rotating your torso to heave the weight."},
{name:"Dumbbell Romanian Deadlift",equipment:"Dumbbell",primary:"Hamstrings",secondary:["Glutes","Back"],level:"Intermediate",type:"hinge",sets:"3 × 8–12",steps:["Stand with feet hip-width and dumbbells at your thighs.","Soften knees and push hips backward.","Lower weights close to legs while maintaining neutral spine.","Stand tall by driving hips forward."],cue:"Stop when you feel a hamstring stretch, before your back rounds.",mistake:"Turning the hinge into a squat."},
{name:"Goblet Squat",equipment:"Dumbbell",primary:"Quads",secondary:["Glutes","Core"],level:"Beginner",type:"squat",sets:"3 × 8–12",steps:["Hold one dumbbell vertically at your chest.","Set feet approximately shoulder-width.","Sit down between your hips while keeping heels grounded.","Push through the whole foot to stand."],cue:"Let knees track in the same direction as toes.",mistake:"Heels lifting or knees collapsing inward."},
{name:"Dumbbell Reverse Lunge",equipment:"Dumbbell",primary:"Quads",secondary:["Glutes","Hamstrings"],level:"Intermediate",type:"squat",sets:"3 × 8–12 / leg",steps:["Stand tall holding dumbbells at your sides.","Step one foot back into a long, stable stance.","Lower until both knees bend comfortably.","Push through front foot to return."],cue:"Control the descent and keep front foot planted.",mistake:"Taking too narrow a step and losing balance."},
{name:"Lat Pulldown",equipment:"Machine",primary:"Back",secondary:["Biceps","Rear delts"],level:"Beginner",type:"pulldown",sets:"3 × 8–12",steps:["Adjust thigh pads to hold legs securely.","Grip bar slightly wider than shoulder width.","Pull bar toward upper chest while drawing elbows down.","Return slowly to an overhead stretch."],cue:"Keep chest lifted and torso mostly still.",mistake:"Pulling behind the neck or rocking back excessively."},
{name:"Seated Cable Row",equipment:"Machine",primary:"Back",secondary:["Biceps","Rear delts"],level:"Beginner",type:"row",sets:"3 × 8–12",steps:["Sit tall with feet braced and knees slightly bent.","Reach forward without rounding lower back.","Pull handle toward lower ribs with elbows tracking back.","Extend arms slowly without jerking torso."],cue:"Lead with elbows, not momentum.",mistake:"Swinging the torso with each repetition."},
{name:"Chest Press Machine",equipment:"Machine",primary:"Chest",secondary:["Triceps","Shoulders"],level:"Beginner",type:"press",sets:"3 × 8–12",steps:["Adjust seat so handles align around mid-chest.","Sit back with feet planted.","Push handles forward without locking elbows aggressively.","Return slowly to a comfortable chest stretch."],cue:"Keep shoulders down and back against the pad.",mistake:"Seat too high or letting shoulders roll forward."},
{name:"Pec Deck Fly",equipment:"Machine",primary:"Chest",secondary:["Shoulders"],level:"Beginner",type:"fly",sets:"3 × 10–15",steps:["Adjust seat so upper arms align roughly with chest.","Keep elbows softly bent against pads or on handles.","Bring arms together in front of chest.","Open slowly to a comfortable stretch."],cue:"Think about bringing upper arms together.",mistake:"Forcing shoulders too far behind the body."},
{name:"Leg Press",equipment:"Machine",primary:"Quads",secondary:["Glutes","Hamstrings"],level:"Beginner",type:"squat",sets:"3 × 10–15",steps:["Sit with back and hips fully against pads.","Place feet shoulder-width on platform.","Lower sled until knees bend comfortably without pelvis rolling.","Press through whole foot, keeping knees aligned."],cue:"Keep your lower back and hips in contact with the seat.",mistake:"Allowing hips to lift or locking knees hard."},
{name:"Leg Extension",equipment:"Machine",primary:"Quads",secondary:[],level:"Beginner",type:"extension",sets:"3 × 10–15",steps:["Align machine pivot with your knee joint.","Adjust shin pad just above ankles.","Straighten knees in a controlled arc.","Lower slowly without dropping the stack."],cue:"Adjust seat and pads to your leg length.",mistake:"Jerking the weight or lifting hips off the seat."},
{name:"Seated Leg Curl",equipment:"Machine",primary:"Hamstrings",secondary:[],level:"Beginner",type:"curl",sets:"3 × 10–15",steps:["Align knees with machine pivot and secure thigh pad.","Place lower-leg pad above heels.","Bend knees to draw lower legs down and back.","Return slowly without letting the weight slam."],cue:"Keep hips seated against the pad.",mistake:"Arching your back to move the weight."},
{name:"Cable Triceps Pushdown",equipment:"Machine",primary:"Triceps",secondary:[],level:"Beginner",type:"pushdown",sets:"3 × 10–15",steps:["Stand near high cable with elbows by your sides.","Grip rope or bar and brace your torso.","Straighten elbows without moving shoulders.","Return slowly until forearms rise comfortably."],cue:"Pin upper arms near ribs.",mistake:"Leaning over and using bodyweight to push."},
{name:"Assisted Pull-up",equipment:"Machine",primary:"Back",secondary:["Biceps"],level:"Intermediate",type:"pulldown",sets:"3 × 6–10",steps:["Select enough assistance to move with control.","Grip handles and place knees or feet on platform.","Pull chest upward by driving elbows down.","Lower under control to near-straight arms."],cue:"More assistance weight means an easier repetition.",mistake:"Kicking or bouncing through reps."},
{name:"Standing Calf Raise",equipment:"Machine",primary:"Calves",secondary:[],level:"Beginner",type:"extension",sets:"3 × 12–20",steps:["Place balls of feet on platform.","Keep legs almost straight with soft knees.","Rise onto toes as high as comfortable.","Lower heels slowly to a gentle stretch."],cue:"Pause briefly at the top.",mistake:"Bouncing quickly through the bottom."}
];
const groups=["All","Chest","Back","Shoulders","Biceps","Triceps","Quads","Hamstrings","Glutes","Calves","Core"];
let tab="library",filter="All",equip="All",query="",selected=null,paused=false;
let saved=JSON.parse(localStorage.getItem("formAtlasWorkout")||"[]");
const app=document.getElementById("app");
function svgDemo(ex,large=false){
let type=ex.type;let machine=ex.equipment==="Machine";
let base=`<ellipse cx="160" cy="222" rx="110" ry="8" fill="#101a1b" opacity=".5"/><g stroke="#a2b3b8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M154 89 L154 151 L132 210 M154 151 L178 210"/><circle cx="154" cy="67" r="17" fill="#a2b3b8" stroke="none"/></g>`;
let armStart,armEnd;
if(["curl","pushdown"].includes(type)){armStart="M154 98 L132 128 L139 169 M154 98 L176 128 L169 169";armEnd="M154 98 L132 128 L118 97 M154 98 L176 128 L190 97";}
else if(["raise","fly"].includes(type)){armStart="M154 99 L126 129 L119 161 M154 99 L182 129 L189 161";armEnd="M154 99 L108 105 L75 103 M154 99 L200 105 L233 103";}
else if(["overhead","pulldown"].includes(type)){armStart="M154 98 L120 119 L112 80 M154 98 L188 119 L196 80";armEnd="M154 98 L126 65 L119 30 M154 98 L182 65 L189 30";}
else if(["row","hinge"].includes(type)){armStart="M154 98 L124 122 L110 165 M154 98 L184 122 L198 165";armEnd="M154 98 L124 122 L138 115 M154 98 L184 122 L170 115";}
else if(["squat","extension"].includes(type)){armStart="M154 98 L124 122 L114 153 M154 98 L184 122 L194 153";armEnd="M154 98 L124 114 L105 131 M154 98 L184 114 L203 131";}
else{armStart="M154 98 L120 126 L116 165 M154 98 L188 126 L192 165";armEnd="M154 98 L120 100 L115 57 M154 98 L188 100 L193 57";}
let equipment=machine?`<g stroke="#667780" stroke-width="5" fill="none" opacity=".8"><path d="M65 220 V45 H245 V220 M65 45 H245"/><path d="M222 45 V120" stroke-dasharray="4 5"/></g>`:`<g stroke="#667780" stroke-width="5" fill="none" opacity=".6"><path d="M95 220 H220"/></g>`;
let weights=`<g stroke="#b8fa69" stroke-width="11" stroke-linecap="round"><path d="M108 157 h17 M184 157 h17"/></g>`;
let moving=`<g stroke="#b8fa69" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="${armStart}"><animate attributeName="d" values="${armStart};${armEnd};${armStart}" dur="2.8s" repeatCount="indefinite"/></path></g>`;
let legs=type==="squat"?`<g stroke="#a2b3b8" stroke-width="9" stroke-linecap="round" fill="none"><path d="M154 151 L132 210 M154 151 L178 210"><animate attributeName="d" values="M154 151 L132 210 M154 151 L178 210;M154 172 L113 182 L132 210 M154 172 L195 182 L178 210;M154 151 L132 210 M154 151 L178 210" dur="2.8s" repeatCount="indefinite"/></path></g>`:"";
return `<svg viewBox="0 0 310 240" role="img" aria-label="Simplified looping motion diagram for ${ex.name}">${equipment}${base}${legs}${moving}<g fill="#b8fa69"><circle cx="154" cy="103" r="5"/></g><path d="M262 104 q14 20 0 40" stroke="#b8fa69" fill="none" stroke-width="2" stroke-dasharray="3 5" opacity=".7"/></svg>`;
}
function header(kicker,title,sub){return `<div class="top"><div><div class="eyebrow">${kicker}</div><h1 class="title">${title}</h1><div class="muted">${sub}</div></div><span class="pill">✦ TRAIN SMARTER</span></div>`}
function card(e){let i=exercises.indexOf(e);return `<article class="card"><div class="art">${svgDemo(e)}<span class="tag">${e.equipment}</span></div><div class="cardbody"><div class="small">${e.level} · ${e.sets}</div><h3>${e.name}</h3><div class="chips"><span class="chip">${e.primary}</span>${e.secondary.slice(0,1).map(x=>`<span class="chip" style="color:#c2cbd1;background:#273039">${x}</span>`).join("")}</div><div class="actions"><button class="btn primary" onclick="openExercise(${i})">View form ↗</button><button class="btn secondary" aria-label="Add to workout" onclick="addExercise(${i})">＋</button></div></div></article>`}
function render(){stop3D();
document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));document.getElementById("sideCount").textContent=saved.length?`(${saved.length})`:"";
if(selected!==null){let e=exercises[selected];app.innerHTML=`<button class="back" onclick="selected=null;render()">← Back to ${tab==="routine"?"workout":"library"}</button>${header("MOVEMENT GUIDE",e.name,`${e.equipment} · ${e.level} · Suggested ${e.sets}`)}<div class="detail"><div><div class="viewer3d" id="viewer3d"><div class="viewerError">Loading interactive 3D exercise demonstration…</div><div class="viewerControls"><span class="viewerHint">↔ Rotate · Scroll to zoom · Simplified 3D</span><button onclick="toggle3D()" id="pause3d">Pause</button></div></div><div class="panel" style="margin-top:15px"><h3>Target muscles</h3><div class="chips"><span class="chip">PRIMARY · ${e.primary}</span>${e.secondary.map(x=>`<span class="chip" style="color:#c8d0d6;background:#28313a">SECONDARY · ${x}</span>`).join("")}</div></div></div><div><div class="panel"><div class="eyebrow">HOW TO PERFORM</div><h3>Step-by-step form</h3><ol class="steps">${e.steps.map(x=>`<li>${x}</li>`).join("")}</ol></div><div class="panel"><h3>✦ Coaching cue</h3><p>${e.cue}</p><h3 class="warn">⚠ Common mistake</h3><p>${e.mistake}</p></div><button class="btn primary" style="width:100%;padding:17px" onclick="addExercise(${selected})">${saved.includes(selected)?"✓ Added to workout":"+ Add to my workout"}</button></div></div>`;requestAnimationFrame(()=>start3D(e));return}
if(tab==="library"){let shown=exercises.filter(e=>(filter==="All"||e.primary===filter||e.secondary.includes(filter))&&(equip==="All"||e.equipment===equip)&&e.name.toLowerCase().includes(query.toLowerCase()));app.innerHTML=`${header("YOUR MOVEMENT ENCYCLOPEDIA","Master every rep.","Explore exercises, understand muscle targeting, and build your session.")}<section class="hero"><div><div class="eyebrow">FORM FIRST. PROGRESS FOLLOWS.</div><h2>Stronger starts with<br>better movement.</h2><p class="muted">20 illustrated exercises covering dumbbells and gym machines. Find your next movement and build a focused workout.</p><button class="btn primary" onclick="switchTab('muscles')">Explore muscle groups →</button></div><div class="orb">◉</div></section><div class="sectionhead"><h2>Exercise library</h2><span class="count">${shown.length} movements</span></div><div class="filters">${groups.map(g=>`<button class="filter ${filter===g?"selected":""}" onclick="setFilter('${g}')">${g}</button>`).join("")}</div><div class="toolbar"><input class="search" aria-label="Search exercises" placeholder="⌕  Search exercises..." value="${query.replaceAll('"',"&quot;")}" oninput="query=this.value;updateCards()"><div><button class="filter ${equip==="All"?"selected":""}" onclick="setEquip('All')">All equipment</button> <button class="filter ${equip==="Dumbbell"?"selected":""}" onclick="setEquip('Dumbbell')">Dumbbells</button> <button class="filter ${equip==="Machine"?"selected":""}" onclick="setEquip('Machine')">Machines</button></div></div><div id="results" class="cards">${shown.map(card).join("")}</div>${shown.length?"":'<div class="empty">No exercises match these filters.</div>'}${footer()}`;return}
if(tab==="muscles"){app.innerHTML=`${header("ANATOMY OF TRAINING","Muscle explorer.","Choose a muscle group to discover the exercises that target it.")}<div class="muscle-grid">${groups.slice(1).map(g=>`<button onclick="filter='${g}';equip='All';query='';switchTab('library')"><div class="eyebrow">TARGET</div><h3>${g}</h3><span class="muted">${exercises.filter(e=>e.primary===g||e.secondary.includes(g)).length} exercises →</span></button>`).join("")}</div><div class="panel" style="margin-top:25px"><h3>Primary vs secondary muscles</h3><p class="muted">Primary muscles provide the main effort in a movement. Secondary muscles assist or stabilise. The exact contribution depends on technique, equipment setup, range of motion and your anatomy.</p></div>${footer()}`;return}
let unique=saved.map(i=>exercises[i]);let targets=[...new Set(unique.map(e=>e.primary))];app.innerHTML=`${header("YOUR TRAINING SPACE","My workout.","Build a simple session from the exercise library.")}<div class="hero"><div><div class="eyebrow">SESSION OVERVIEW</div><h2>${saved.length} exercises selected</h2><p class="muted">${targets.length?`Primary muscle groups: ${targets.join(", ")}`:"Start by adding exercises from the library."}</p><button class="btn primary" onclick="switchTab('library')">Browse exercises →</button></div><div class="stat">${saved.length.toString().padStart(2,"0")}</div></div><div class="panel"><h3>Selected exercises</h3>${saved.length?saved.map((i,n)=>`<div class="routineItem"><div><strong>${n+1}. ${exercises[i].name}</strong><div class="small">${exercises[i].primary} · ${exercises[i].sets}</div></div><div class="actions"><button class="btn secondary" onclick="openExercise(${i})">Form</button><button class="btn secondary" onclick="removeExercise(${i})">Remove</button></div></div>`).join(""):'<div class="empty">Your workout is empty. Add some movements to begin.</div>'}</div>${footer()}`;
}
function footer(){return `<div class="footer">Educational guidance only. The 3D models are simplified and some movements remain approximations, not precise joint mechanics or machine setup. Adjust equipment to your body and seek a qualified coach for personalised form assessment. Exercise descriptions are informed by established strength-training guidance, including the <a href="https://www.acefitness.org/resources/everyone/exercise-library/" target="_blank" rel="noopener" style="color:#b8fa69">ACE Exercise Library</a>.</div>`}
function switchTab(t){tab=t;selected=null;render();window.scrollTo(0,0)}
function openExercise(i){selected=i;render();window.scrollTo(0,0)}
function setFilter(g){filter=g;render()}
function setEquip(e){equip=e;render()}
function updateCards(){let shown=exercises.filter(e=>(filter==="All"||e.primary===filter||e.secondary.includes(filter))&&(equip==="All"||e.equipment===equip)&&e.name.toLowerCase().includes(query.toLowerCase()));document.getElementById("results").innerHTML=shown.map(card).join("")||'<div class="empty">No exercises found.</div>';document.querySelector(".count").textContent=shown.length+" movements"}
function addExercise(i){if(!saved.includes(i)){saved.push(i);localStorage.setItem("formAtlasWorkout",JSON.stringify(saved))}render()}
function removeExercise(i){saved=saved.filter(x=>x!==i);localStorage.setItem("formAtlasWorkout",JSON.stringify(saved));render()}
document.querySelectorAll(".nav").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));
</script><script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
let scene3d=null,renderer3d=null,frame3d=0,playing3d=true;
function stop3D(){if(frame3d)cancelAnimationFrame(frame3d);frame3d=0;if(renderer3d){renderer3d.dispose();renderer3d=null}scene3d=null}
function toggle3D(){playing3d=!playing3d;const b=document.getElementById("pause3d");if(b)b.textContent=playing3d?"Pause":"Play"}
function start3D(ex){
const el=document.getElementById("viewer3d");if(!el)return;
if(!window.THREE){el.querySelector(".viewerError").innerHTML="3D viewer needs an internet connection to load its rendering library.<div style='margin-top:15px'>The exercise instructions below remain available.</div>";return}
try{
const T=THREE, scene=new T.Scene(), camera=new T.PerspectiveCamera(38,1,.1,100), renderer=new T.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(el.clientWidth,el.clientWidth<600?330:410);renderer.outputColorSpace=T.SRGBColorSpace;
renderer.shadowMap.enabled=true;el.querySelector(".viewerError").remove();el.prepend(renderer.domElement);renderer3d=renderer;scene3d=scene;
scene.add(new T.HemisphereLight(0xe9f8ff,0x25322b,2.5));let light=new T.DirectionalLight(0xffffff,3);light.position.set(3,7,5);scene.add(light);
const mat=(c,rough=.7)=>new T.MeshStandardMaterial({color:c,roughness:rough,metalness:.08}), skin=mat(0xd1a07d),shirt=mat(0x9fe866),pants=mat(0x424e60),metal=mat(0x87979f),dark=mat(0x26313a),weight=mat(0x192329),floor=mat(0x26372e);
const ground=new T.Mesh(new T.CylinderGeometry(2.9,2.9,.07,64),floor);ground.position.y=-.035;scene.add(ground);
function ball(r,m){return new T.Mesh(new T.SphereGeometry(r,16,12),m)}
function segment(a,b,r,m){let d=new T.Vector3().subVectors(b,a),mesh=new T.Mesh(new T.CylinderGeometry(r,r,d.length(),12),m);mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.clone().normalize());scene.add(mesh);return mesh}
function vec(x,y,z){return new T.Vector3(x,y,z)}
function rod(a,b,r,m){return segment(vec(...a),vec(...b),r,m)}
function box(w,h,d,x,y,z,m){let o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}
function cylinder(radius,height,x,y,z,m){let o=new T.Mesh(new T.CylinderGeometry(radius,radius,height,18),m);o.position.set(x,y,z);scene.add(o);return o}
const machine=ex.equipment==="Machine";
if(machine){rod([-1.0,0,-.7],[-1.0,2.55,-.7],.045,metal);rod([1,0,-.7],[1,2.55,-.7],.045,metal);rod([-1,2.55,-.7],[1,2.55,-.7],.045,metal);box(.8,.15,.65,0,.52,-.35,dark);box(.8,.75,.12,0,1.02,-.65,dark)}
const t=ex.type;
const seated=machine && ["press","row","fly","extension","pulldown","curl"].includes(t) || ex.name.includes("Seated Dumbbell");
const benchPress=ex.name.includes("Bench Press")||ex.name.includes("Incline Dumbbell");
if(!machine&&benchPress){box(.75,.13,2.15,0,.77,-.50,dark);for(let z of [-1.2,.2])rod([0,.72,z],[0,0,z],.045,metal)}
if(!machine&&ex.name.includes("Seated Dumbbell")){box(.75,.13,.65,0,.66,0,dark);box(.75,.85,.13,0,1.1,-.32,dark)}
const parts=[];function joint(p,r,m){let o=ball(r,m);o.position.copy(p);scene.add(o);parts.push(o);return o}
function limb(a,b,r,m){let o=segment(a,b,r,m);parts.push(o);return o}
let pelvis=joint(vec(0,1.05,0),.19,pants),chest=joint(vec(0,1.55,0),.28,shirt),head=joint(vec(0,2.12,0),.16,skin);
let neck=limb(vec(0,1.78,0),vec(0,1.98,0),.075,skin);
let body=limb(vec(0,1.05,0),vec(0,1.65,0),.22,shirt);
let leftLeg=[],rightLeg=[],arms=[];
for(let side of [-1,1]){
let hip=vec(side*.14,1.04,0),knee=vec(side*.17,.58,.08),ankle=vec(side*.17,.13,.09);
leftLeg.push(limb(hip,knee,.11,pants),limb(knee,ankle,.085,pants));
let foot=box(.22,.12,.36,side*.17,.08,.19,dark);parts.push(foot);
let shoulder=vec(side*.31,1.67,0),elbow=vec(side*.45,1.30,.05),hand=vec(side*.47,.99,.05);
arms.push({side,upper:limb(shoulder,elbow,.085,shirt),lower:limb(elbow,hand,.065,skin),shoulder,elbow,hand,dumbbell:null});
if(!machine){let db=box(.32,.14,.14,side*.47,.99,.05,weight);parts.push(db);arms[arms.length-1].dumbbell=db}
}
// Keep the athlete separate from the stationary equipment so their whole pose can change.
const athlete=new T.Group();scene.add(athlete);
for(const obj of [...parts,...arms.flatMap(a=>[a.upper,a.lower])])athlete.attach(obj);
// Bench: rotate around the hip into a supported supine position.
// Seated: lower the pelvis and flex the knees instead of standing through the seat.
if(benchPress){athlete.position.set(0,-.21,.36);athlete.rotation.x=-Math.PI/2;}
else if(seated){athlete.position.set(0,-.49,-.12);}
function align(mesh,a,b){let d=b.clone().sub(a);mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.scale.y=d.length()/mesh.geometry.parameters.height;mesh.quaternion.setFromUnitVectors(vec(0,1,0),d.normalize())}
let az=.62,ele=.21,dist=5.9,drag=false,px=0,py=0;
function cam(){camera.position.set(Math.sin(az)*Math.cos(ele)*dist,1.2+Math.sin(ele)*dist,Math.cos(az)*Math.cos(ele)*dist);camera.lookAt(0,1.22,0)}cam();
renderer.domElement.addEventListener("pointerdown",e=>{drag=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener("pointerup",()=>drag=false);
renderer.domElement.addEventListener("pointermove",e=>{if(!drag)return;az-=(e.clientX-px)*.009;ele=Math.max(-.25,Math.min(.85,ele+(e.clientY-py)*.007));px=e.clientX;py=e.clientY;cam()});
renderer.domElement.addEventListener("wheel",e=>{e.preventDefault();dist=Math.max(3.5,Math.min(9,dist+e.deltaY*.005));cam()},{passive:false});
let clock=0,last=performance.now();
function animate(now){
if(scene3d!==scene||!document.getElementById("viewer3d"))return;
frame3d=requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.06);last=now;if(playing3d)clock+=dt;
let q=(1-Math.cos(clock*2.15))/2;
for(let a of arms){
let s=a.side,shoulder=vec(s*.31,1.67,0),elbow,hand;
switch(t){
case "curl":case "pushdown": elbow=vec(s*.42,1.35,.02);hand=vec(s*(.43-.04*q),.99+.52*q,.07+.16*q);break;
case "raise":case "fly":elbow=vec(s*(.45+.33*q),1.34+.30*q,.02);hand=vec(s*(.5+.57*q),1.01+.61*q,.05);break;
case "overhead":case "pulldown":elbow=vec(s*(.48-.08*q),1.55+.27*q,.02);hand=vec(s*(.60-.25*q),1.7+.68*q,.02);break;
case "row":case "hinge":elbow=vec(s*.44,1.27,.02-.27*q);hand=vec(s*.46,1.02,.08-.47*q);break;
case "press":
// In supine local coordinates, the hands move anteriorly (towards the ceiling).
if(benchPress){elbow=vec(s*(.52-.16*q),1.48+.04*q,.18+.30*q);hand=vec(s*(.56-.22*q),1.42+.04*q,.28+.64*q);}
else {elbow=vec(s*(.48-.08*q),1.33+.17*q,.04+.24*q);hand=vec(s*(.56-.18*q),1.06+.46*q,.15+.43*q);}break;
case "squat":case "extension":elbow=vec(s*.4,1.39,.12);hand=vec(s*.38,1.19,.26);break;
default:elbow=vec(s*.45,1.35,.06);hand=vec(s*.48,1.02+.35*q,.1)
}
align(a.upper,shoulder,elbow);align(a.lower,elbow,hand);if(a.dumbbell)a.dumbbell.position.copy(hand);
}
let squat=t==="squat"?q*.37:0;
pelvis.position.y=1.05-squat;chest.position.y=1.55-squat;head.position.y=2.12-squat;body.position.y=1.35-squat;neck.position.y=1.88-squat;
if(benchPress){
// Bent knees and feet on the ground; bench extends behind the shoulders.
for(let i=0;i<2;i++){let side=i===0?-1:1;
let hip=vec(side*.14,1.04,0),knee=vec(side*.2,.70,.49),ankle=vec(side*.2,.25,.62);
align(leftLeg[i*2],hip,knee);align(leftLeg[i*2+1],knee,ankle);
}
}
if(seated){for(let i=0;i<2;i++){let side=i===0?-1:1;
let hip=vec(side*.14,1.04,0),knee=vec(side*.19,.98,.50),ankle=vec(side*.19,.50,.51);
align(leftLeg[i*2],hip,knee);align(leftLeg[i*2+1],knee,ankle);
}}
if(t==="squat"){for(let i=0;i<2;i++){let side=i===0?-1:1,hip=vec(side*.14,1.04-squat,0),knee=vec(side*.23,.58-squat*.35,.18+q*.2),ankle=vec(side*.2,.13,.08);align(leftLeg[i*2],hip,knee);align(leftLeg[i*2+1],knee,ankle)}}
renderer.render(scene,camera)
}
frame3d=requestAnimationFrame(animate);
}catch(err){console.error(err);el.innerHTML="<div class='viewerError'>Unable to initialise 3D viewer. Please try a modern browser with hardware acceleration enabled.</div>"}
}
render();
</script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('/Gym/sw.js',{scope:'/Gym/'}).catch(console.warn))}</script></body></html>
