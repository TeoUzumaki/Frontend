<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole! 🐹</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --grass: #5dbe52;
    --grass-dark: #3d9e35;
    --dirt: #c8895a;
    --dirt-dark: #a0673a;
    --sky: #87CEEB;
    --sun: #FFD700;
    --mole: #8B5E3C;
    --mole-face: #c49a6c;
    --pink: #FF6B9D;
    --yellow: #FFD93D;
    --orange: #FF8C42;
    --purple: #9B59B6;
    --red: #E74C3C;
    --cyan: #00CEC9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: linear-gradient(180deg, #a8edea 0%, #87CEEB 40%, #5dbe52 40%);
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    position: relative;
  }
a.back-link {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 999;
  font-family: 'Fredoka One', cursive;
  font-size: 1rem;
  color: white;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border: 2px solid #FFD93D;
  border-radius: 50px;
  padding: 10px 18px;
  text-decoration: none;
  box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
  transition: transform 0.1s, box-shadow 0.1s, background 0.2s;
  letter-spacing: 0.5px;
  font-weight: bold;
}

a.back-link:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
  background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
}

a.back-link:active {
  transform: translateY(0);
}

  /* Floating clouds */
  .cloud {
    position: fixed;
    background: white;
    border-radius: 50px;
    opacity: 0.85;
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: white;
    border-radius: 50%;
  }
  .cloud:nth-child(1) { width: 100px; height: 35px; top: 8%; left: -120px; animation-duration: 18s; animation-delay: 0s; }
  .cloud:nth-child(1)::before { width: 50px; height: 50px; top: -25px; left: 15px; }
  .cloud:nth-child(1)::after { width: 35px; height: 35px; top: -15px; left: 45px; }
  .cloud:nth-child(2) { width: 70px; height: 25px; top: 15%; left: -100px; animation-duration: 25s; animation-delay: 5s; }
  .cloud:nth-child(2)::before { width: 35px; height: 35px; top: -18px; left: 10px; }
  .cloud:nth-child(2)::after { width: 25px; height: 25px; top: -10px; left: 35px; }
  .cloud:nth-child(3) { width: 120px; height: 40px; top: 5%; left: -150px; animation-duration: 22s; animation-delay: 10s; }
  .cloud:nth-child(3)::before { width: 60px; height: 60px; top: -30px; left: 20px; }
  .cloud:nth-child(3)::after { width: 45px; height: 45px; top: -20px; left: 60px; }

  @keyframes drift { to { left: 110vw; } }

  /* Sun */
  .sun {
    position: fixed;
    top: 30px;
    right: 80px;
    width: 70px;
    height: 70px;
    background: radial-gradient(circle, #FFE566, #FFD700);
    border-radius: 50%;
    box-shadow: 0 0 30px #FFD70088, 0 0 60px #FFD70044;
    animation: sunPulse 3s ease-in-out infinite;
  }
  @keyframes sunPulse { 0%,100%{box-shadow:0 0 30px #FFD70088,0 0 60px #FFD70044}50%{box-shadow:0 0 45px #FFD700aa,0 0 80px #FFD70066} }

  header {
    text-align: center;
    padding: 20px 0 5px;
    position: relative;
    z-index: 10;
  }

  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2.5rem, 6vw, 4rem);
    color: white;
    text-shadow: 4px 4px 0 #2d7a24, 6px 6px 0 #1a5c14;
    letter-spacing: 2px;
    animation: bounce 2s ease-in-out infinite;
  }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

  .scoreboard {
    display: flex;
    gap: 20px;
    margin: 10px 0;
    flex-wrap: wrap;
    justify-content: center;
  }

  .score-card {
    background: white;
    border-radius: 20px;
    padding: 8px 22px;
    font-weight: 800;
    font-size: 1.1rem;
    box-shadow: 0 4px 0 #ddd, 0 6px 15px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .score-card.score { background: #FFD93D; color: #333; }
  .score-card.timer { background: #FF6B9D; color: white; }
  .score-card.best { background: #9B59B6; color: white; }

  .score-val {
    font-family: 'Fredoka One', cursive;
    font-size: 1.5rem;
  }

  .btn-group { margin: 8px 0; display: flex; gap: 10px; }

  button {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    padding: 10px 28px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    box-shadow: 0 5px 0 rgba(0,0,0,0.2);
  }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }

  #startBtn { background: #5dbe52; color: white; font-size: 1.3rem; padding: 12px 36px; }
  #startBtn:hover { background: #4aad3f; }

  .difficulty-btns button {
    font-size: 0.9rem;
    padding: 6px 16px;
    background: white;
    color: #555;
  }
  .difficulty-btns button.active { background: var(--orange); color: white; }

  /* Game grid */
  .game-area {
    position: relative;
    z-index: 5;
    margin-top: 10px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding: 10px;
  }

  .hole-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }

  .hole {
    width: clamp(100px, 20vw, 140px);
    height: clamp(40px, 8vw, 55px);
    background: radial-gradient(ellipse, #6b3c1a 0%, #3d1f08 100%);
    border-radius: 50%;
    position: relative;
    overflow: visible;
    box-shadow: inset 0 8px 20px rgba(0,0,0,0.6), 0 4px 8px rgba(0,0,0,0.3);
    margin-bottom: -5px;
  }

  .mole-container {
    width: clamp(100px, 20vw, 140px);
    height: clamp(100px, 20vw, 140px);
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
  }

  .mole {
    position: absolute;
    bottom: -100%;
    width: clamp(75px, 15vw, 105px);
    height: clamp(90px, 18vw, 125px);
    transition: bottom 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }

  .hole-wrap.active .mole { bottom: 0; }
  .hole-wrap.whacked .mole { bottom: -10%; filter: brightness(0.7); }

  /* SVG Mole face */
  .mole svg { width: 100%; height: 100%; }

  /* Hit flash */
  .hit-flash {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2rem;
    pointer-events: none;
    opacity: 0;
    z-index: 20;
    transition: none;
  }
  .hit-flash.show {
    animation: popFade 0.5s ease-out forwards;
  }
  @keyframes popFade {
    0% { opacity: 1; transform: translate(-50%, -80%) scale(0.5); }
    50% { opacity: 1; transform: translate(-50%, -120%) scale(1.3); }
    100% { opacity: 0; transform: translate(-50%, -160%) scale(1); }
  }

  /* Score pop */
  .score-pop {
    position: fixed;
    font-family: 'Fredoka One', cursive;
    font-size: 2rem;
    color: #FFD93D;
    text-shadow: 2px 2px 0 #FF8C42;
    pointer-events: none;
    z-index: 100;
    animation: scorePop 0.8s ease-out forwards;
  }
  @keyframes scorePop {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
  }

  /* Overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    backdrop-filter: blur(4px);
  }
  .overlay.hidden { display: none; }

  .overlay-box {
    background: white;
    border-radius: 30px;
    padding: 40px 50px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .overlay-box h2 {
    font-family: 'Fredoka One', cursive;
    font-size: 2.5rem;
    color: #333;
    margin-bottom: 10px;
  }
  .overlay-box p {
    font-size: 1.2rem;
    color: #666;
    margin-bottom: 20px;
  }
  .overlay-box .final-score {
    font-family: 'Fredoka One', cursive;
    font-size: 4rem;
    color: var(--orange);
  }

  /* Dirt mound decoration */
  .dirt-mound {
    width: clamp(110px, 22vw, 155px);
    height: 20px;
    background: linear-gradient(180deg, #c8895a, #a0673a);
    border-radius: 50%;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    margin-top: -8px;
  }

  /* Grass strip at bottom of holes */
  .grass-strip {
    position: relative;
    z-index: 3;
    margin-top: 5px;
  }

  /* Music Player */
  .music-player {
    position: fixed;
    top: 16px;
    right: 16px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 50px;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 998;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    backdrop-filter: blur(10px);
  }

  .music-player button {
    background: white;
    color: #667eea;
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.1s, box-shadow 0.1s;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    padding: 0;
  }

  .music-player button:active {
    transform: scale(0.95);
  }

  .music-player button:hover {
    background: #FFD93D;
  }

  .volume-slider {
    width: 80px;
    cursor: pointer;
    accent-color: #FFD93D;
  }

  .music-label {
    color: white;
    font-size: 0.85rem;
    font-weight: 600;
    min-width: 30px;
    text-align: center;
  }
</style>
</head>
<body>

<!-- Music Player -->
<div class="music-player">
  <button id="musicToggle" onclick="toggleMusic()">🔊</button>
  <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70" onchange="setVolume()">
  <span class="music-label" id="volumeLabel">70</span>
</div>
<audio id="bgMusic" preload="auto"></audio>

<!-- Back Button -->
<a href="games.html" class="back-link">⚔️ ← Games</a>

<!-- Background decorations -->
<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>
<div class="sun"></div>

<header>
  <h1>🐹 Whack-a-Mole!</h1>
  <div class="scoreboard">
    <div class="score-card score">⭐ Score: <span class="score-val" id="score">0</span></div>
    <div class="score-card timer">⏱ Time: <span class="score-val" id="timer">30</span>s</div>
    <div class="score-card best">🏆 Best: <span class="score-val" id="best">0</span></div>
  </div>
  <div class="btn-group" style="display:none;"></div>
  <div id="startBtnOld" style="display:none;"></div>
</header>

<div class="game-area">
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <div style="font-size:4rem">🐹</div>
    <h2>Whack-a-Mole!</h2>
    <p>Whack those moles before they disappear!</p>
    <div style="display:flex;gap:10px;justify-content:center;margin:12px 0;">
      <button class="diff-btn" data-diff="easy">😊 Easy</button>
      <button class="diff-btn active" data-diff="normal">🎯 Normal</button>
      <button class="diff-btn" data-diff="hard">🔥 Hard</button>
    </div>
    <button id="startBtn" style="background:#5dbe52;color:white;font-size:1.3rem;padding:12px 36px;">🎮 Start Game!</button>
  </div>
</div>

<div class="overlay hidden" id="endOverlay">
  <div class="overlay-box">
    <div style="font-size:3rem" id="endEmoji">🎉</div>
    <h2 id="endTitle">Time's Up!</h2>
    <p>Your score:</p>
    <div class="final-score" id="finalScore">0</div>
    <p id="endMessage" style="margin-bottom: 5px;"></p>
    <button id="playAgainBtn" style="background:#FF6B9D;color:white;margin-top:15px;">🔄 Play Again!</button>
  </div>
</div>

<script>
const DIFFICULTIES = {
  easy: { moleTime: 1400, interval: 900, timeLimit: 30 },
  normal: { moleTime: 900, interval: 650, timeLimit: 30 },
  hard: { moleTime: 550, interval: 400, timeLimit: 30 }
};

let score = 0;
let bestScore = 0;
let timeLeft = 30;
let gameActive = false;
let timerInterval, moleInterval;
let currentDiff = 'normal';
let activeMoles = new Set();

const MOLE_COLORS = ['#8B5E3C', '#A0522D', '#6B4226', '#7B4F35'];
const HIT_EMOJIS = ['💥', '⭐', '✨', '💫', '🌟', '👊'];

function createMoleSVG(color) {
  const faceColor = lighten(color, 30);
  return `<svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
    <!-- Body -->
    <ellipse cx="50" cy="95" rx="38" ry="30" fill="${color}"/>
    <!-- Head -->
    <ellipse cx="50" cy="55" rx="35" ry="32" fill="${color}"/>
    <!-- Face -->
    <ellipse cx="50" cy="62" rx="22" ry="18" fill="${faceColor}"/>
    <!-- Eyes -->
    <circle cx="40" cy="52" r="5" fill="#222"/>
    <circle cx="60" cy="52" r="5" fill="#222"/>
    <circle cx="41.5" cy="50.5" r="1.5" fill="white"/>
    <circle cx="61.5" cy="50.5" r="1.5" fill="white"/>
    <!-- Nose -->
    <ellipse cx="50" cy="62" rx="6" ry="4" fill="#FF6B9D"/>
    <!-- Nostrils -->
    <circle cx="47" cy="62" r="1.5" fill="#d44"/>
    <circle cx="53" cy="62" r="1.5" fill="#d44"/>
    <!-- Mouth -->
    <path d="M 43 68 Q 50 75 57 68" stroke="#555" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Ears -->
    <ellipse cx="22" cy="35" rx="10" ry="13" fill="${color}"/>
    <ellipse cx="22" cy="35" rx="6" ry="9" fill="#FFB6C1"/>
    <ellipse cx="78" cy="35" rx="10" ry="13" fill="${color}"/>
    <ellipse cx="78" cy="35" rx="6" ry="9" fill="#FFB6C1"/>
    <!-- Hands -->
    <ellipse cx="15" cy="90" rx="10" ry="7" fill="${color}" transform="rotate(-20, 15, 90)"/>
    <ellipse cx="85" cy="90" rx="10" ry="7" fill="${color}" transform="rotate(20, 85, 90)"/>
  </svg>`;
}

function lighten(hex, amount) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r + amount); g = Math.min(255, g + amount); b = Math.min(255, b + amount);
  return `rgb(${r},${g},${b})`;
}

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const color = MOLE_COLORS[i % MOLE_COLORS.length];
    const wrap = document.createElement('div');
    wrap.className = 'hole-wrap';
    wrap.dataset.index = i;
    wrap.innerHTML = `
      <div class="mole-container">
        <div class="mole">${createMoleSVG(color)}</div>
        <div class="hit-flash"></div>
      </div>
      <div class="hole"></div>
      <div class="dirt-mound"></div>
    `;
    wrap.addEventListener('click', () => whack(i, wrap));
    grid.appendChild(wrap);
  }
}

function whack(index, wrap) {
  if (!gameActive || !activeMoles.has(index)) return;
  activeMoles.delete(index);
  wrap.classList.remove('active');
  wrap.classList.add('whacked');
  setTimeout(() => wrap.classList.remove('whacked'), 300);

  score++;
  document.getElementById('score').textContent = score;

  // Hit emoji
  const flash = wrap.querySelector('.hit-flash');
  flash.textContent = HIT_EMOJIS[Math.floor(Math.random() * HIT_EMOJIS.length)];
  flash.classList.remove('show');
  void flash.offsetWidth;
  flash.classList.add('show');

  // Score pop
  const pop = document.createElement('div');
  pop.className = 'score-pop';
  pop.textContent = '+1';
  const rect = wrap.getBoundingClientRect();
  pop.style.left = rect.left + rect.width/2 + 'px';
  pop.style.top = rect.top + 'px';
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 800);
}

function showMole() {
  const holes = document.querySelectorAll('.hole-wrap');
  const available = [...Array(9).keys()].filter(i => !activeMoles.has(i));
  if (!available.length) return;
  const idx = available[Math.floor(Math.random() * available.length)];
  const wrap = holes[idx];
  activeMoles.add(idx);
  wrap.classList.add('active');

  const diff = DIFFICULTIES[currentDiff];
  setTimeout(() => {
    if (activeMoles.has(idx)) {
      activeMoles.delete(idx);
      wrap.classList.remove('active');
    }
  }, diff.moleTime);
}

function startGame() {
  score = 0;
  activeMoles.clear();
  document.getElementById('score').textContent = 0;
  const diff = DIFFICULTIES[currentDiff];
  timeLeft = diff.timeLimit;
  document.getElementById('timer').textContent = timeLeft;
  gameActive = true;

  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('endOverlay').classList.add('hidden');

  // Reset holes
  document.querySelectorAll('.hole-wrap').forEach(w => w.classList.remove('active', 'whacked'));

  moleInterval = setInterval(showMole, diff.interval);
  timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').textContent = timeLeft;
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  clearInterval(moleInterval);
  clearInterval(timerInterval);
  gameActive = false;
  activeMoles.clear();
  document.querySelectorAll('.hole-wrap').forEach(w => w.classList.remove('active'));

  if (score > bestScore) {
    bestScore = score;
    document.getElementById('best').textContent = bestScore;
  }

  document.getElementById('finalScore').textContent = score;
  const msgs = score >= 20 ? ['🏆 Amazing!', "You're a mole-whacking legend!", '🎉'] :
                score >= 10 ? ['👍 Nice work!', 'Those moles didn\'t stand a chance!', '😄'] :
                ['🐹 Keep trying!', 'The moles escaped this time...', '😅'];
  document.getElementById('endTitle').textContent = msgs[0];
  document.getElementById('endMessage').textContent = msgs[1];
  document.getElementById('endEmoji').textContent = msgs[2];
  document.getElementById('endOverlay').classList.remove('hidden');
}

// Event listeners
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('hidden');
  startGame();
});
document.getElementById('playAgainBtn').addEventListener('click', startGame);

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentDiff = btn.dataset.diff;
  });
});

// ===== MUSIC PLAYER SETUP =====
// CHANGE THIS TO THE NAME OF YOUR MP3 FILE IN THE SAME DIRECTORY
const SONG_FILE = 'Prettybaby.mp3';

const bgMusic = document.getElementById('bgMusic');
const musicToggle = document.getElementById('musicToggle');
const volumeSlider = document.getElementById('volumeSlider');
const volumeLabel = document.getElementById('volumeLabel');

// Set the music file source
bgMusic.src = SONG_FILE;
bgMusic.volume = 0.7;

// Toggle play/pause
function toggleMusic() {
  if (bgMusic.paused) {
    bgMusic.play();
    musicToggle.textContent = '🔉';
  } else {
    bgMusic.pause();
    musicToggle.textContent = '🔊';
  }
}

// Set volume
function setVolume() {
  const vol = volumeSlider.value;
  bgMusic.volume = vol / 100;
  volumeLabel.textContent = vol;
}

buildGrid();
</script>
</body>
</html>
